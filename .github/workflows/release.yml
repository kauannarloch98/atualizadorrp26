name: Build and Release AtualizadorERP

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '(\d+\.\d+(\.\d+)*)') {
              $ver = $matches[1]
          } else {
              $ver = "1.0.0"
          }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "Compiling version: $ver"

      - name: Publish Win-x64 Single-File Executable
        run: |
          dotnet publish AtualizadorERP/AtualizadorERP.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.APP_VERSION }} -p:AssemblyVersion=${{ env.APP_VERSION }}.0 -p:FileVersion=${{ env.APP_VERSION }}.0 -o ./publish

      - name: Upload Executable to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./publish/AtualizadorERP.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
